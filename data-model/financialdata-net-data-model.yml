  - /esg-ratings
  - /industry-esg-scores
  representative_fields:
  - trading_symbol
  - central_index_key
  - registrant_name
  - industry
  - date
  - esg_corporate_rating
  - esg_industry_rank
relationships:
- from: Security
  to: Company
  type: belongs_to
  via: trading_symbol -> central_index_key
  evidence: /company-information returns both trading_symbol and central_index_key on the same record.
- from: Security
  to: SecurityIdentifiers
  type: has_one
  via: trading_symbol
  evidence: /securities-information is keyed on trading_symbol and returns cusip_number, isin_number, figi_identifier.
- from: Security
  to: PriceBar
  type: has_many
  via: trading_symbol + date|time
  evidence: Every price endpoint takes ?identifier=<symbol> and returns trading_symbol on each bar.
- from: Security
  to: Quote
  type: has_one
  via: trading_symbol
  evidence: /stock-quotes?identifiers=MSFT,AAPL returns one current record per symbol.
- from: Company
  to: FinancialStatement
  type: has_many
  via: central_index_key + fiscal_year + fiscal_period
  evidence: /income-statements returns central_index_key, fiscal_year, fiscal_period, period_end_date.
- from: Company
  to: FinancialRatio
  type: has_many
  via: central_index_key + fiscal_year + fiscal_period
  evidence: Ratio endpoints repeat the statement period key.
- from: Company
  to: InsiderTransaction
  type: has_many
  via: central_index_key
  evidence: /insider-transactions returns the issuer central_index_key alongside insider_central_index_key.
- from: Company
  to: EsgAssessment
  type: has_many
  via: central_index_key + date
  evidence: /esg-ratings returns central_index_key and date.
- from: Company
  to: CorporateAction
  type: has_many
  via: trading_symbol + date
  evidence: /dividends and /stock-splits are addressed by ?identifier=<symbol>.
- from: InstitutionalInvestor
  to: Holding
  type: has_many
  via: central_index_key + period_of_report
  evidence: /institutional-holdings returns investor_name, central_index_key and period_of_report per position
    row.
- from: Holding
  to: Security
  type: belongs_to
  via: cusip_number | isin_number | trading_symbol
  evidence: Holdings rows carry cusip_number and trading_symbol; the CUSIP is authoritative because 13F is filed
    on CUSIP.
- from: Fund
  to: Holding
  type: has_many
  via: series_id | fund_symbol + period_of_report
  evidence: /mutual-fund-holdings and /etf-holdings return the fund key plus per-position rows.
- from: Index
  to: Security
  type: has_many
  via: index trading_symbol -> constituent trading_symbol
  evidence: /index-constituents?identifier=^GSPC returns the constituent symbol list.
- from: NewsItem
  to: Security
  type: has_many
  via: trading_symbols (comma-joined list)
  evidence: /latest-news returns a PLURAL trading_symbols field, unlike every other endpoint.
- from: EconomicIndicator
  to: EconomicIndicatorValue
  type: has_many
  via: indicator_id + date
  evidence: /economic-indicator-values?identifier=<indicator_id> returns indicator_id, date, value.
- from: InvestmentAdviser
  to: Company
  type: none
  via: null
  evidence: Advisers carry their own central_index_key and lei_number; no documented edge joins an adviser to
    an issuer.
- from: LegislatorTrade
  to: Security
  type: belongs_to
  via: trading_symbol
  evidence: /senate-trading and /house-trading return trading_symbol and asset_name; there is no CIK on these
    rows.
gaps:
- No object/detail endpoints — every endpoint returns a collection, so there is no canonical single-record representation
  of any entity.
- 'No hypermedia: records carry no links, no self URLs and no ids that resolve anywhere.'
- 'Two identifier namespaces never meet: EconomicIndicator (indicator_id) shares no key with the securities graph.'
- NewsItem uses a plural `trading_symbols` field where the rest of the API uses singular `trading_symbol` — a
  naming inconsistency an agent will trip on.
- 'Symbol namespaces are conventional, not typed: ^GSPC, SHEL.L, EURUSD and BTCUSD all live in the same `trading_symbol`
  field with no discriminator.'
