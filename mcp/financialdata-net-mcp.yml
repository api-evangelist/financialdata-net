personal_data: >-
  Six of the tools below return named individuals -- getExecutiveCompensation,
  getInsiderTransactions, getSenateTrading, getHouseTrading and the two
  investment-adviser tools. All are mandatory public regulatory filings (SEC
  Form 4 / DEF 14A, STOCK Act, Form ADV), keyed by issuer or trading symbol with
  no search-by-person parameter, and carrying no contact details. Annotated as a
  people facet, not withheld. Do not derive a person-lookup tool from them.
method: searched
status: published
source: https://financialdata.net/mcp-server (server URL, naming rule and four published tool names); live JSON-RPC
  probe of https://financialdata.net/mcp; https://financialdata.net/documentation (endpoint catalogue)
note: 'FinancialData.Net operates a first-party HOSTED MCP server. It is remote-only: an https endpoint an MCP client
  POSTs to, with the API key carried in the query string (https://financialdata.net/mcp?key=API_KEY). There is no
  npx/stdio package — npm was searched and holds no FinancialData.Net package. Access is restricted to the Professional
  and Enterprise plans, so tools/list is auth-gated: an anonymous POST of {"jsonrpc":"2.0","id":1,"method":"tools/list"}
  returned HTTP 200 with JSON-RPC error -32001 "Unauthorized" (probed 2026-08-22), which confirms a live MCP JSON-RPC
  server but yields no inputSchema. The tool list below is therefore NOT a captured tools/list response. The provider
  states on its MCP page that it "mapped our entire API documentation directly into the MCP server" and that "if
  an endpoint exists in our docs, your AI has a corresponding tool to call it", and publishes four worked examples
  of the naming rule (stock-symbols -> getStockSymbols, income-statements -> getIncomeStatements, etf-prices ->
  getEtfPrices, and getStockPrices). Each tool below is that stated rule applied to a documented endpoint, with
  name_source marking which four names the provider published verbatim and which are derived. Real inputSchemas
  require an authenticated introspection with a Professional/Enterprise key; the parameters listed are the documented
  REST query parameters the tool wraps.'
deployment:
  mode: remote
  endpoint: https://financialdata.net/mcp
  install: null
  package: null
  auth: api-key
  auth_note: 'API key passed as the `key` query parameter on the endpoint URL: https://financialdata.net/mcp?key=API_KEY.
    No OAuth: /.well-known/oauth-authorization-server and /.well-known/oauth-protected-resource both 404.'
  verified: probed
  verified_note: POST tools/list without a key -> HTTP 200, {"jsonrpc":"2.0","id":null,"error":{"code":-32001,"message":"Unauthorized"}}
    on 2026-08-22.
  plan_gate: Professional ($149/mo) and Enterprise ($299/mo) subscribers only
server:
