note: >-
  Five self-serve tiers published openly on the pricing page, each with both a monthly and an
  annual price (the annual price is billed yearly and marketed as "30% off"). There is no
  "contact us" enterprise tier: the top tier, Enterprise, is priced publicly at $299/month.
  Personal-use and Commercial-use are presented as two tabs over the same ladder — Free/Standard/
  Premium are personal-use only, Professional adds internal commercial use, and Enterprise adds
  external commercial use plus data display and redistribution rights. The quota attached to each
  tier is a request-rate limit, not a request allowance, except on Free which is a daily cap.
  Payment methods published on the FAQ: credit and debit cards, PayPal, Google Pay, Apple Pay,
  Link. Minimum subscription 1 month; cancel any time; all purchases non-refundable
  (Terms of Service section on subscriptions).
