name: FinancialData.Net
description: >-
  A financial-data provider offering a single REST API (with JSON/CSV responses) covering stock, ETF, crypto, forex, and
  derivatives market data, company fundamentals, financial statements, news, economic indicators, insider/institutional
  trading, and ESG data sourced from public regulators (SEC, FINRA). Also offers a hosted MCP server, an official Python
  SDK, and an Excel add-in.
