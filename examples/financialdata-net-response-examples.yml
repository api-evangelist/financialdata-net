personal_data: >-
  CONTAINS NAMED INDIVIDUALS. Seven of these endpoints return the names of real
  people: Executive Compensation (executive_name), Insider Transactions
  (insider_name), Senate Trading and House Trading (name_of_reporting_person),
  and the Investment Adviser endpoints. Every one is a mandatory PUBLIC
  regulatory disclosure -- SEC Form 4 and DEF 14A, STOCK Act periodic
  transaction reports, Form ADV -- where publication is the statutory purpose,
  and the values below are the provider's own published documentation examples
  captured verbatim, not responses we fetched. No contact details are exposed:
  no email, no telephone, no address. Access is keyed by issuer or trading
  symbol; there is NO search-by-person parameter anywhere in the API. Annotated
  rather than removed, per the catalog's personal-data rule for a general
  endpoint that merely includes a people facet. Do not build a person-lookup
  skill or MCP tool on top of these.
method: searched
source: https://financialdata.net/documentation
note: The provider publishes a worked request URL and a sample JSON response for every one of its 86 endpoints. Those examples are captured here VERBATIM, one entry per endpoint, so they are usable as a
  machine-readable example set even though there is no OpenAPI to hang them off. Truncated arrays in the source (shown as "...") are preserved exactly as the provider wrote them; nothing was completed,
  reformatted or invented. Sample values are illustrative market data published by the provider, not live quotes.
example_count: 86
